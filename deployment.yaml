apiVersion: apps/v1
kind: Deployment

metadata:
  name: task-manager-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: task-manager

  template:
    metadata:
      labels:
        app: task-manager

    spec:
      containers:
        - name: task-manager-container
          image: task-manager:1.0
          imagePullPolicy: Never

          ports:
            - containerPort: 3000
